name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check frontend
        run: pnpm type

      - name: Type check server
        run: pnpm server:type

      - name: Lint
        run: pnpm lint

      - name: Integration tests
        run: pnpm test:integration
        env:
          DATA_DIR: .tmp-integration

      - name: Build frontend
        run: pnpm build

      - name: Build server
        run: pnpm server:build
